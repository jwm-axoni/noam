name: Release

# Manual-only for now (docs/RELEASE.md): a human dispatches a release, the
# workflow bumps the version, and the human reviews the resulting DRAFT GitHub
# Release, then publishes it. No automatic tag/push trigger yet. Every dispatch
# ships a new version: patch by default, or the bump chosen at dispatch time.
# The version sources are app/apps/desktop/package.json,
# src-tauri/tauri.conf.json, src-tauri/Cargo.toml, and the `desktop` entry in
# src-tauri/Cargo.lock (kept equal by scripts/bump-version.mjs).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the version bump, create the GitHub Release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every dispatch ships a new version. The bump commits straight to main with
  # [skip ci] so the push does not re-trigger the repo's own workflows; the
  # publication-readiness job below re-scans the bumped tree anyway, and the
  # build job re-verifies the four version sources agree.
  bump-version:
    name: bump-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Bump version
        id: bump
        run: |
          node scripts/bump-version.mjs --bump "${{ inputs.bump }}"
          ver=$(node -p "require('./app/apps/desktop/src-tauri/tauri.conf.json').version")
          echo "Bumped to $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Commit and push the bump
        run: |
          git config user.name "noam-release"
          git config user.email "noreply@noam.invalid"
          git add app/apps/desktop/package.json \
            app/apps/desktop/src-tauri/tauri.conf.json \
            app/apps/desktop/src-tauri/Cargo.toml \
            app/apps/desktop/src-tauri/Cargo.lock
          git commit -m "chore(release): bump to v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

  # Gate a release on the same publication checks that guard main, so a release
  # can never ship from a tree that would fail the guardrails.
  publication-readiness:
    name: publication-readiness
    needs: [bump-version]
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Test repository guards
        run: |
          node scripts/check-publication.test.mjs
          node scripts/check-push.test.mjs
          node scripts/install-git-guards.test.mjs
      - name: Scan current repository contents
        run: node scripts/check-publication.mjs --scope tree --fail-on-review
      - name: Scan all committed content
        run: node scripts/check-publication.mjs --scope range --range HEAD --fail-on-review
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  build-macos:
    name: build-macos (Developer ID + notarized + updater-signed)
    needs: [publication-readiness, bump-version]
    runs-on: macos-latest
    # Signing/notarization/updater private keys are exposed to this job, so it
    # runs in a protected environment: create a `release` environment in repo
    # settings with a required reviewer to gate every signed release behind an
    # approval. Environment secrets are read here in addition to repo secrets.
    environment: release
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Full history: the release notes are generated from the commits
          # since the previous tag.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable
      - name: Set up Rust
        # TODO: pin to a commit SHA to match the checkout/node/gitleaks steps above.
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        # TODO: pin to a commit SHA.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/apps/desktop/src-tauri
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Verify version consistency
        working-directory: app/apps/desktop
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::Version mismatch — tauri.conf.json, package.json and Cargo.toml must agree before a release."
            exit 1
          fi
      - name: Generate release notes
        id: notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo 'body<<NOAM_NOTES_EOF'
            echo "## What's new in v${{ needs.bump-version.outputs.version }}"
            echo ""
            if [ -n "$prev_tag" ]; then
              git log "$prev_tag"..HEAD --pretty=format:'- %s (%h)' --reverse | grep -v 'chore(release): bump' || true
            else
              git log --pretty=format:'- %s (%h)' --reverse -20 | grep -v 'chore(release): bump' || true
            fi
            echo ""
            echo 'NOAM_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build, sign, notarize, and draft the release
        # TODO: pin to a commit SHA.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (root of trust for auto-update).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app/apps/desktop
          tagName: v__VERSION__
          releaseName: "Noam v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # tauri-action uploads the .dmg, the .app.tar.gz + .sig, and generates
          # and uploads latest.json (the manifest the in-app updater polls).
