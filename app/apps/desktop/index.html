<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/noam-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noam</title>
    <script>
      // Paint the persisted theme before first render to avoid a flash.
      (function () {
        try {
          var m = localStorage.getItem("cbk-theme");
          var dark =
            m === "dark" ||
            (m !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
